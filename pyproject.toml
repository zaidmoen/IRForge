[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "irforge"
version = "0.1.0"
description = "A small information retrieval engine built from scratch for learning and experimentation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "IRForge Contributors"}]
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
